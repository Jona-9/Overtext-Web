<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>Error del servidor — OVERTEXT</title>
    <!-- Framework: Bootstrap 5.3 por CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Arquitectura ITCSS OVERTEXT -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/tema-overtext.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/componentes/navegacion.css">
    <link rel="stylesheet" href="/css/componentes/botones.css">
    <link rel="stylesheet" href="/css/componentes/footer.css">
</head>

<body>

    <!-- E2-19 · spec 004: misma resolución automática que error/404.html,
         para cualquier respuesta 500. -->
    <nav th:replace="~{layout/plantilla :: cabecera(paginaActiva=null, mostrarCarrito=false)}"></nav>

    <main class="cuerpo-pagina">
        <section class="container text-center py-5 my-5">
            <span class="subtitulo-superior d-block mb-3">ERROR 500</span>
            <h1 class="titulo-gigante mb-4">ALGO SALIÓ MAL</h1>
            <p class="texto-parrafo mb-4">Ya lo estamos revisando. Vuelve a intentarlo en un momento.</p>
            <a th:href="@{/}" class="btn btn-dark">VOLVER AL INICIO</a>
        </section>
    </main>

    <th:block th:replace="~{layout/plantilla :: pie}"></th:block>

    <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>

</body>

</html>
