<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>Página no encontrada — OVERTEXT</title>
    <!-- Framework: Bootstrap 5.3 por CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Arquitectura ITCSS OVERTEXT -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/tema-overtext.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/componentes/navegacion.css">
    <link rel="stylesheet" href="/css/componentes/botones.css">
    <link rel="stylesheet" href="/css/componentes/footer.css">
</head>

<body>

    <!-- E2-07 · spec 004: página resuelta automáticamente por Spring Boot
         (BasicErrorController) para cualquier respuesta 404, sin controlador
         propio — ver decisión A del spec. paginaActiva=null: ninguna pestaña
         del menú corresponde a un error; mostrarCarrito=false: esta página no
         incluye el fragment `carrito`, así que no debe llevar el id que
         carrito.js espera (trampa T9). -->
    <nav th:replace="~{layout/plantilla :: cabecera(paginaActiva=null, mostrarCarrito=false)}"></nav>

    <main class="cuerpo-pagina">
        <section class="container text-center py-5 my-5">
            <span class="subtitulo-superior d-block mb-3">ERROR 404</span>
            <h1 class="titulo-gigante mb-4">ESTA PÁGINA NO EXISTE</h1>
            <p class="texto-parrafo mb-4">Revisa la dirección o vuelve al catálogo.</p>
            <a th:href="@{/}" class="btn btn-dark">VOLVER AL INICIO</a>
        </section>
    </main>

    <th:block th:replace="~{layout/plantilla :: pie}"></th:block>

    <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>

</body>

</html>
