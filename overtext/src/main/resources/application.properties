spring.application.name=overtext

server.port=${OVERTEXT_PORT:8080}
logging.level.pe.edu.utp.overtext=${OVERTEXT_LOG_LEVEL:INFO}

# Importar variables locales desde .env si existe (sin romper si no existe)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ==============================================================================
# Conexión a Base de Datos Supabase (PostgreSQL) con Pool HikariCP
# Credenciales inyectadas mediante variables de entorno (Ambiente seguro)
# ==============================================================================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.cdodvtruaevryrbreacm}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.pool-name=OverTextHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Configuración JPA / Hibernate (Generación automática de tablas en Supabase)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
